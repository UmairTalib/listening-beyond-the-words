# Model snapshots of the pilot, each pinned to a Hugging Face commit.
# Fetch them once on an OMNI login node (jobs never download):
#   "$UV_PROJECT_ENVIRONMENT/bin/python" scripts/fetch_models.py
# Jobs then load them offline from $LBW_WORKSPACE/hf.

voxtral:
  repo_id: mistralai/Voxtral-Mini-3B-2507
  revision: "3060fe34b35ba5d44202ce9ff3c097642914f8f3"
  # Transformers weights only. consolidated.safetensors and params.json hold the
  # same model in Mistral's own format (9.3 GB more).
  ignore:
    - consolidated.safetensors
    - params.json

# English CTC speech model: places the transcript words on the audio (forced
# alignment); also one of the two recognisers of the word check (F4).
wav2vec2_960h:
  repo_id: facebook/wav2vec2-large-960h-lv60-self
  revision: "54074b1c16f4de6a5ad59affb4caa8f2ea03a119"
  ignore:
    - flax_model.msgpack
    - tf_model.h5

# Speaker verification: tells the interviewer's voice from the participant's.
wavlm_sv:
  repo_id: microsoft/wavlm-base-plus-sv
  revision: "feb593a6c23c1cc3d9510425c29b0a14d2b07b1e"
