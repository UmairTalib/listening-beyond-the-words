# Data settings of the pilot; see docs/pilot_protocol.md, section "Speech used".
# Paths are relative to the workspace root. Built files are pinned by their SHA-256,
# and steps stop when a file no longer matches.

labels:
  run: derived/labels/run-20261112T103229Z # written by scripts/build_labels.py
  sha256: 37f264807ada4e9b71268a4895f31fae6e439d2a90454480d31a5dc4245c2e08

interviewer_filter:
  run: derived/interviewer/run-12429618 # written by scripts/flag_interviewer.py
  drop_share: 0.5 # drop a line when this share of its speech windows sounds like the interviewer
  drop_interviewer_phrases: true # drop a line that contains a known interviewer phrase
  drop_unclear_min_seconds: 1.5 # drop a line this long that has no 0.75 s of detected speech

broken_timestamps:
  min_seconds: 30 # a line at least this long ...
  max_words_per_second: 1.0 # ... with fewer words per second has broken timestamps: dropped

participant_lines:
  run: derived/participant_lines/run-20261112T111930Z # written by scripts/select_lines.py
  sha256: b0fefb711b148e641664e79392c977a265b4439d195ba00d6a2d876070503a82

word_times:
